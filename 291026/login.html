<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Recruitment & Placement Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6fa;
            color: #202b3c
        }

        header {
            background: #173b70;
            color: #fff;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap
        }

        header h1 {
            font-size: 20px;
            margin: 0
        }

        header p {
            margin: 5px 0 0;
            font-size: 13px
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 70px)
        }

        nav {
            background: #fff;
            width: 205px;
            padding: 18px 12px;
            box-sizing: border-box;
            border-right: 1px solid #dce2eb
        }

        nav a {
            display: block;
            padding: 10px 12px;
            margin: 3px 0;
            color: #173b70;
            text-decoration: none;
            border-radius: 4px
        }

        nav a:hover {
            background: #eaf0fa
        }

        main {
            padding: 24px;
            flex: 1;
            min-width: 0
        }

        h2 {
            margin-top: 0;
            color: #173b70
        }

        h3 {
            color: #243d61
        }

        .panel {
            background: #fff;
            border: 1px solid #dce2eb;
            border-radius: 6px;
            padding: 16px;
            margin: 0 0 18px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 12px;
            margin-bottom: 18px
        }

        .card {
            background: #fff;
            border: 1px solid #dce2eb;
            border-radius: 6px;
            padding: 15px
        }

        .number {
            font-size: 24px;
            font-weight: bold;
            color: #173b70;
            margin-top: 8px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: #fff;
            margin-top: 10px
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #dce2eb;
            text-align: left;
            font-size: 14px
        }

        th {
            background: #173b70;
            color: #fff
        }

        tr:nth-child(even) {
            background: #f7f9fc
        }

        label {
            display: block;
            font-size: 14px;
            margin: 10px 0 5px
        }

        input,
        select,
        textarea {
            box-sizing: border-box;
            padding: 9px;
            width: 100%;
            border: 1px solid #cbd4e1;
            border-radius: 4px;
            background: #fff
        }

        button,
        .button {
            display: inline-block;
            padding: 9px 14px;
            border: 1px solid #173b70;
            border-radius: 4px;
            background: #173b70;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            margin: 8px 5px 0 0
        }

        .secondary {
            background: #fff;
            color: #173b70
        }

        .badge {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 12px;
            background: #e6f4ea;
            color: #23643a;
            font-size: 12px;
            font-weight: bold
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px
        }

        .muted {
            color: #68778b;
            font-size: 13px
        }

        footer {
            text-align: center;
            color: #718096;
            font-size: 12px;
            padding: 18px
        }

        @media(max-width:700px) {
            .layout {
                display: block
            }

            nav {
                width: auto;
                border-right: 0;
                border-bottom: 1px solid #dce2eb
            }

            nav a {
                display: inline-block
            }

            main {
                padding: 14px;
                overflow-x: auto
            }

            table {
                min-width: 650px
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>RECRUITMENT &amp; PLACEMENT MANAGEMENT SYSTEM</h1>
            <p>Kiran Academy</p>
        </div>
    </header>
    <main style="max-width:520px;margin:35px auto">
        <section class="panel">
            <h2>Login</h2>
            <p class="muted">Authorized users only</p>
            <form action="dashboard.html"><label>Username / Email *</label><input type="email" required
                    value="recruiter@demo.com"><label>Password *</label><input type="password" required
                    placeholder="Enter password"><label>Role *</label><select required>
                    <option>Recruiter</option>
                    <option>Admin</option>
                    <option>Placement Officer</option>
                </select>
                <p><a href="login.html">Forgot Password?</a> <span class="muted">(prototype only)</span></p><button
                    type="submit">Login</button><button type="reset" class="secondary">Reset</button>
            </form>
        </section>
    </main>
    <footer>Kiran Academy | Recruitment &amp; Placement Management System</footer>
</body>

</html>
